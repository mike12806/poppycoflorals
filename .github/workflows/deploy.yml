name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  PAGES_PROJECT: poppycoflorals
  ZONE_NAME: poppycoflorals.com
  APEX_DOMAIN: poppycoflorals.com
  WWW_DOMAIN: www.poppycoflorals.com
  WRANGLER_VERSION: "3.90.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Create Cloudflare Pages project
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages project create ${{ env.PAGES_PROJECT }} --production-branch=main
        continue-on-error: true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages deploy site --project-name=${{ env.PAGES_PROJECT }} --commit-dirty=true

      - name: Register custom domains
        run: |
          for DOMAIN in "${APEX_DOMAIN}" "${WWW_DOMAIN}"; do
            RESPONSE=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/pages/projects/${PAGES_PROJECT}/domains" \
              -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"name\": \"${DOMAIN}\"}")
            echo "Response for ${DOMAIN}: $RESPONSE"
            SUCCESS=$(echo "$RESPONSE" | jq -r '.success // "false"' 2>/dev/null)
            if [ "$SUCCESS" != "true" ]; then
              CODE=$(echo "$RESPONSE" | jq -r '.errors[0].code // ""' 2>/dev/null)
              MESSAGE=$(echo "$RESPONSE" | jq -r '.errors[0].message // "Unknown error"' 2>/dev/null)
              if [[ "$CODE" == "8000003" ]] || [[ "$MESSAGE" == *"already"* ]]; then
                echo "Domain ${DOMAIN} already registered"
              else
                echo "Error registering ${DOMAIN} ($CODE): $MESSAGE"
                exit 1
              fi
            else
              echo "Domain ${DOMAIN} registered successfully"
            fi
          done
        continue-on-error: true

      - name: Configure DNS CNAMEs for custom domains
        run: |
          # Read the actual pages.dev subdomain from the Pages project
          PROJECT_RESPONSE=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/pages/projects/${PAGES_PROJECT}" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json")
          PAGES_DOMAIN=$(echo "$PROJECT_RESPONSE" | jq -r '.result.subdomain // ""')
          if [ -z "$PAGES_DOMAIN" ]; then
            echo "Could not read pages.dev subdomain from API, falling back to default"
            PAGES_DOMAIN="${PAGES_PROJECT}.pages.dev"
          fi
          echo "Pages domain: $PAGES_DOMAIN"

          # Look up the zone ID for the apex domain
          ZONE_RESPONSE=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/zones?name=${ZONE_NAME}" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json")
          ZONE_ID=$(echo "$ZONE_RESPONSE" | jq -r '.result[0].id // ""')
          if [ -z "$ZONE_ID" ]; then
            echo "Failed to get zone ID for ${ZONE_NAME}"
            exit 1
          fi
          echo "Zone ID: $ZONE_ID"

          # Apex uses CNAME flattening; www is a plain CNAME
          for DOMAIN in "${APEX_DOMAIN}" "${WWW_DOMAIN}"; do
            RECORDS_RESPONSE=$(curl -s -X GET \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=CNAME&name=${DOMAIN}" \
              -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
              -H "Content-Type: application/json")
            RECORD_ID=$(echo "$RECORDS_RESPONSE" | jq -r '.result[0].id // ""')

            PAYLOAD="{\"type\":\"CNAME\",\"name\":\"${DOMAIN}\",\"content\":\"$PAGES_DOMAIN\",\"proxied\":true}"

            if [ -n "$RECORD_ID" ]; then
              echo "Updating existing CNAME record $RECORD_ID for ${DOMAIN}..."
              RESULT=$(curl -s -X PUT \
                "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RECORD_ID" \
                -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD")
            else
              echo "Creating new CNAME record for ${DOMAIN}..."
              RESULT=$(curl -s -X POST \
                "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
                -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD")
            fi

            SUCCESS=$(echo "$RESULT" | jq -r '.success // "false"')
            if [ "$SUCCESS" != "true" ]; then
              echo "Error configuring DNS record for ${DOMAIN}: $(echo "$RESULT" | jq -c '.errors')"
              exit 1
            fi
            echo "DNS CNAME configured: ${DOMAIN} -> $PAGES_DOMAIN"
          done

      - name: Verify custom domains
        run: |
          for DOMAIN in "${APEX_DOMAIN}" "${WWW_DOMAIN}"; do
            PATCH_RESPONSE=$(curl -s -X PATCH \
              "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/pages/projects/${PAGES_PROJECT}/domains/${DOMAIN}" \
              -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{}')
            echo "Verify response for ${DOMAIN}: $PATCH_RESPONSE"
            SUCCESS=$(echo "$PATCH_RESPONSE" | jq -r '.success // "false"' 2>/dev/null)
            if [ "$SUCCESS" != "true" ]; then
              echo "Warning: domain verification trigger for ${DOMAIN} may not have succeeded: $(echo "$PATCH_RESPONSE" | jq -c '.errors // []')"
            else
              STATUS=$(echo "$PATCH_RESPONSE" | jq -r '.result.status // "unknown"' 2>/dev/null)
              echo "Domain verification initiated for ${DOMAIN}, status: $STATUS"
            fi
          done

      - name: Purge Cloudflare cache
        run: |
          ZONE_RESPONSE=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/zones?name=${ZONE_NAME}" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json")
          ZONE_ID=$(echo "$ZONE_RESPONSE" | jq -r '.result[0].id // ""')
          if [ -z "$ZONE_ID" ]; then
            echo "Failed to get zone ID for ${ZONE_NAME}"
            exit 1
          fi
          echo "Zone ID: $ZONE_ID"
          PURGE_RESPONSE=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"hosts\": [\"${APEX_DOMAIN}\", \"${WWW_DOMAIN}\"]}")
          echo "Purge response: $PURGE_RESPONSE"
          SUCCESS=$(echo "$PURGE_RESPONSE" | jq -r '.success // "false"' 2>/dev/null)
          if [ "$SUCCESS" != "true" ]; then
            echo "Failed to purge Cloudflare cache: $(echo "$PURGE_RESPONSE" | jq -c '.errors // []')"
            exit 1
          fi
          echo "Cache purged successfully"
